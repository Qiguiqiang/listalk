<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151B24"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2CE8A5"/>
      <stop offset="1" stop-color="#45C7F2"/>
    </linearGradient>
  </defs>
  <!-- app-icon tile -->
  <rect x="2" y="2" width="104" height="104" rx="24" fill="url(#bg)" stroke="#26303F" stroke-width="2"/>
  <!-- bridge arc: a link/bridge curve passing over the waveform -->
  <path d="M26 40 Q54 22 82 40" fill="none" stroke="url(#bars)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="26" cy="40" r="3.6" fill="#2CE8A5"/>
  <circle cx="82" cy="40" r="3.6" fill="#45C7F2"/>
  <!-- waveform bars (mic green -> speaker blue) -->
  <g fill="url(#bars)">
    <rect x="28" y="48" width="7" height="16" rx="3.5"/>
    <rect x="41" y="42" width="7" height="28" rx="3.5"/>
    <rect x="54" y="36" width="7" height="40" rx="3.5" transform="translate(-3.5 0)"/>
    <rect x="64" y="42" width="7" height="28" rx="3.5"/>
    <rect x="77" y="48" width="7" height="16" rx="3.5"/>
  </g>
</svg>
